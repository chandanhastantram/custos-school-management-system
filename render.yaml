# Render Blueprint - Custos School Management System
# https://render.com/docs/blueprint-spec

services:
  # ── Backend API (FastAPI) ──────────────────────────
  - type: web
    name: custos-api
    runtime: docker
    repo: https://github.com/chandanhastantram/custos-school-management-system
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "true"
      - key: PORT
        value: "8000"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./custos.db"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://custos-school-management-system.onrender.com,https://custos-app.onrender.com,http://localhost:5173,http://localhost:3000"
      - key: RATE_LIMIT_REQUESTS
        value: "200"
    healthCheckPath: /health

  # ── Frontend (Vite Static Site) ────────────────────
  - type: web
    name: custos-app
    runtime: static
    repo: https://github.com/chandanhastantram/custos-school-management-system
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://custos-api.onrender.com/api/v1"
